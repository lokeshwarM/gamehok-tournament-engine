spring:
  application:
    name: gamehok-tournament-engine

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ─────────────────────────────────────────────
  # DataSource — PostgreSQL
  # Override via environment variables in production
  # ─────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gamehok_tournament}
    username: ${DATABASE_USERNAME:gamehok}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TournamentHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000        # 5 minutes
      connection-timeout: 20000   # 20 seconds
      max-lifetime: 1800000       # 30 minutes
      connection-test-query: SELECT 1

  # ─────────────────────────────────────────────
  # JPA / Hibernate
  # NO auto-ddl — Flyway manages schema
  # ─────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        cache:
          use_second_level_cache: false
          use_query_cache: false

  # ─────────────────────────────────────────────
  # Flyway Database Migrations
  # ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    schemas: public

  # ─────────────────────────────────────────────
  # Mail (for email notifications)
  # ─────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ─────────────────────────────────────────────
  # Jackson JSON
  # ─────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ─────────────────────────────────────────────
  # Cache
  # ─────────────────────────────────────────────
  cache:
    type: simple

# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# ─────────────────────────────────────────────
# Actuator
# ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Gamehok Tournament Engine
    version: "@project.version@"
    description: Production-grade esports tournament orchestration platform

# ─────────────────────────────────────────────
# Security / JWT
# ─────────────────────────────────────────────
security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-this-in-production-must-be-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}          # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

# ─────────────────────────────────────────────
# OpenAPI / Swagger
# ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging:
  level:
    com.gamehok.tournament: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# ─────────────────────────────────────────────
# Tournament Engine Config
# ─────────────────────────────────────────────
tournament:
  engine:
    matchmaking:
      elo-window-initial: 100
      elo-window-expansion: 50
      elo-window-max: 500
      expansion-interval-seconds: 30
      cycle-interval-seconds: 15
    match:
      result-submission-timeout-hours: 24
      check-in-window-minutes: 30
    scheduler:
      enabled: true
